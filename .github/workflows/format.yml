name: Format check

on:
  push:
    paths:
      - 'src/**'
      - '.clang-format'
      - '.github/workflows/format.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.clang-format'
      - '.github/workflows/format.yml'

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install clang-format
        run: pip install clang-format==23.1.2

      - name: Check formatting
        run: make -C src format-check
